<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1800" viewBox="0 0 1600 900" font-family="Heiti TC, Arial, sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="800" y="60" text-anchor="middle" font-size="34" font-weight="bold" fill="#1B1D36">Migration Kit 四層架構 — 模型可換，repo 裡的知識與驗證迴圈不變</text>
<!-- agent box top -->
<rect x="480" y="95" width="640" height="80" rx="14" fill="#1B1D36"/>
<text x="800" y="128" text-anchor="middle" font-size="24" fill="#FFFFFF" font-weight="bold">任一 AI Agent（可替換）</text>
<text x="800" y="158" text-anchor="middle" font-size="17" fill="#CFD3E0">Claude Code · Codex · Cursor · OpenHands · 內部 LLM（agent_loop.py）</text>
<!-- arrows -->
<line x1="800" y1="175" x2="800" y2="215" stroke="#1B1D36" stroke-width="4"/>
<polygon points="790,210 810,210 800,228" fill="#1B1D36"/>
<!-- layers -->
<g>
<rect x="120" y="235" width="1360" height="120" rx="12" fill="#E6F2F4" stroke="#007B8C" stroke-width="3"/>
<rect x="120" y="235" width="220" height="120" rx="12" fill="#007B8C"/>
<text x="230" y="285" text-anchor="middle" font-size="24" fill="#FFFFFF" font-weight="bold">② 指令層</text>
<text x="230" y="318" text-anchor="middle" font-size="16" fill="#E6F2F4">Instruction</text>
<text x="370" y="275" font-size="20" fill="#1B1D36" font-weight="bold">AGENTS.md</text><text x="520" y="275" font-size="18" fill="#1B1D36">— 目標、界線、十條規則（開放慣例；CLAUDE.md 指到它）</text>
<text x="370" y="310" font-size="20" fill="#1B1D36" font-weight="bold">docs/playbooks/*.md</text><text x="620" y="310" font-size="18" fill="#1B1D36">— 每類一份「判斷樹 + before/after」，規則短、例子多</text>
<text x="370" y="340" font-size="16" fill="#555">格式：純 Markdown，不含任何工具專屬語法</text>
</g>
<g>
<rect x="120" y="375" width="1360" height="120" rx="12" fill="#EEF0F7" stroke="#005C8A" stroke-width="3"/>
<rect x="120" y="375" width="220" height="120" rx="12" fill="#005C8A"/>
<text x="230" y="425" text-anchor="middle" font-size="24" fill="#FFFFFF" font-weight="bold">① 知識層</text>
<text x="230" y="458" text-anchor="middle" font-size="16" fill="#E6F2F4">Knowledge</text>
<text x="370" y="415" font-size="20" fill="#1B1D36" font-weight="bold">mapping_544.json</text><text x="590" y="415" font-size="18" fill="#1B1D36">— 逐條舊碼 / 建議碼 / 兩端實測 / PM 覆核</text>
<text x="370" y="450" font-size="20" fill="#1B1D36" font-weight="bold">vcf91_api_catalog.json</text><text x="640" y="450" font-size="18" fill="#1B1D36">— VCF 9.1 全部 9,768 條 REST API（官方 SDK 機械抽出）</text>
<text x="370" y="480" font-size="16" fill="#555">rules.md（14 條，附實測狀態碼）· auth-matrix.md · 用 lookup.py 按需查，不整份塞 prompt</text>
</g>
<g>
<rect x="120" y="515" width="1360" height="120" rx="12" fill="#F0EBF5" stroke="#6C4B94" stroke-width="3"/>
<rect x="120" y="515" width="220" height="120" rx="12" fill="#6C4B94"/>
<text x="230" y="565" text-anchor="middle" font-size="24" fill="#FFFFFF" font-weight="bold">③ 驗證層</text>
<text x="230" y="598" text-anchor="middle" font-size="16" fill="#F0EBF5">Verification</text>
<text x="370" y="555" font-size="20" fill="#1B1D36" font-weight="bold">scan_legacy.py</text><text x="560" y="555" font-size="18" fill="#1B1D36">— 找舊 pattern；<tspan font-weight="bold">0 hits = 遷完</tspan>（機器可判定）</text>
<text x="370" y="590" font-size="20" fill="#1B1D36" font-weight="bold">pytest + cassettes</text><text x="590" y="590" font-size="18" fill="#1B1D36">— lab 錄的真實回應離線回放；不需帳密、不碰生產</text>
<text x="370" y="620" font-size="16" fill="#555">verify.py = scan 0 且 tests 綠 → PASS；測試綠只代表「沒壞」，scanner 0 才代表「遷完」</text>
</g>
<g>
<rect x="120" y="655" width="1360" height="120" rx="12" fill="#FDF6E0" stroke="#F3BA16" stroke-width="3"/>
<rect x="120" y="655" width="220" height="120" rx="12" fill="#F3BA16"/>
<text x="230" y="705" text-anchor="middle" font-size="24" fill="#1B1D36" font-weight="bold">④ 工具層</text>
<text x="230" y="738" text-anchor="middle" font-size="16" fill="#1B1D36">Tools</text>
<text x="370" y="695" font-size="20" fill="#1B1D36" font-weight="bold">CLI</text><text x="430" y="695" font-size="18" fill="#1B1D36">— lookup / scan / verify / progress：有 shell 的 agent 都能用</text>
<text x="370" y="730" font-size="20" fill="#1B1D36" font-weight="bold">agent_loop.py</text><text x="540" y="730" font-size="18" fill="#1B1D36">— OpenAI-compatible endpoint 的最小迴圈（vLLM / Ollama / LiteLLM / 內部閘道）</text>
<text x="370" y="760" font-size="16" fill="#555">同一組工具可再包成 MCP server；先 CLI 後 MCP</text>
</g>
<text x="800" y="830" text-anchor="middle" font-size="20" fill="#007B8C" font-weight="bold">agent 迴圈：scan → 取一條 → lookup / playbook → 改寫 → verify → 綠了才下一條 → progress.py 回報</text>
<text x="800" y="870" text-anchor="middle" font-size="16" fill="#777">硬規則：只改 legacy_app/ · 不改測試與 cassette · 憑證不進 repo · 不碰真實環境</text>
</svg>
